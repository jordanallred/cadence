name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: npm ci
      - run: npm test
      - run: npm run prepare:wasm
      - run: npm run build
      - run: npm run build:desktop
      - run: go test ./...
        working-directory: desktop
      # The browser comes from Playwright's CDN. Its OS packages come from
      # Ubuntu's mirrors, which are sometimes unreachable from runners; the
      # runner image already has what Chromium needs to start, so a mirror
      # outage only warns. A real missing library still fails the e2e step.
      - run: npx playwright install chromium
      - run: timeout -k 10 120 npx playwright install-deps chromium || echo "::warning::Could not install Chromium's OS packages within 2 minutes (Ubuntu mirrors unreachable or hanging); using the runner's own."
      - name: End-to-end test with real pedaling video
        run: npm run e2e
