name: Release
# Push a version tag (for example `git tag v0.2.0 && git push origin v0.2.0`)
# to build downloads for Windows, macOS and Linux and attach them to a
# GitHub release. The pose model is not bundled; the app downloads it from
# Google's MediaPipe storage on first run and verifies its checksum.
on:
  push:
    tags: ["v*"]
  # Or run it from the Actions tab: builds the chosen branch as this
  # version and creates the tag if it does not exist yet.
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, e.g. v0.3.0
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: npm ci
      - run: npm test
      - run: npm run prepare:wasm
      - run: npm run build
      - name: Build launchers
        env:
          CADENCE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: npm run build:desktop -- --all
      - run: npx playwright install --with-deps chromium
      - name: End-to-end test with real pedaling video
        run: npm run e2e
      - name: Package
        run: |
          cd release
          mkdir pkg
          for f in cadence-*; do
            name="${f%.exe}"
            mkdir "pkg/$name"
            if [[ "$f" == *.exe ]]; then
              cp "$f" "pkg/$name/cadence.exe"
            else
              cp "$f" "pkg/$name/cadence"
              chmod +x "pkg/$name/cadence"
            fi
            cp ../LICENSE ../THIRD_PARTY_NOTICES.md ../docs/download.md "pkg/$name/"
            if [[ "$f" == *.exe ]]; then
              (cd pkg && zip -qr "../$name.zip" "$name")
            else
              (cd pkg && tar -czf "../$name.tar.gz" "$name")
            fi
          done
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.tar.gz
            release/SHA256SUMS.txt
