name: Release
# Push a version tag (for example `git tag v0.2.0 && git push origin v0.2.0`)
# to build downloads for Windows, macOS and Linux and attach them to a
# GitHub release. The pose model is not bundled; the app downloads it from
# Google's MediaPipe storage on first run and verifies its checksum.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: npm ci
      - run: npm test
      - run: npm run prepare:wasm
      - run: npm run build
      - name: Build launchers
        env:
          CADENCE_VERSION: ${{ github.ref_name }}
        run: npm run build:desktop -- --all
      - name: Package
        run: |
          cd release
          for f in cadence-*; do
            base="${f%.exe}"
            mkdir "$base"
            cp "$f" "$base/"
            cp ../LICENSE ../THIRD_PARTY_NOTICES.md ../docs/download.md "$base/"
            if [[ "$f" == *.exe ]]; then zip -qr "$base.zip" "$base"; else tar -czf "$base.tar.gz" "$base"; fi
          done
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.tar.gz
            release/SHA256SUMS.txt
